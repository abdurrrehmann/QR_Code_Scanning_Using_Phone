<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile WebRTC Scanner</title>
  
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg: #090d16;
      --surface: #131c2e;
      --surface-card: #1e293b;
      --surface-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: rgba(19, 28, 46, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      padding: 0.9rem 1.25rem;
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; justify-content: space-between;
    }

    .brand-title { font-size: 1rem; font-weight: 700; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.35rem 0.8rem; border-radius: 9999px;
      font-size: 0.75rem; font-weight: 600; background: rgba(239, 68, 68, 0.12); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3);
      transition: all 0.3s ease;
    }
    .status-pill.connected { background: rgba(16, 185, 129, 0.12); color: var(--success); border-color: rgba(16, 185, 129, 0.3); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background-color: currentColor; }
    .status-pill.connected .status-dot { box-shadow: 0 0 8px var(--success); }

    main { flex: 1; padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; max-width: 480px; margin: 0 auto; width: 100%; }

    .card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 1.25rem;
      padding: 1.25rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .pairing-header { margin-bottom: 1rem; }
    .pairing-title { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .pairing-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 0.25rem; }

    .manual-pair-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .manual-input {
      flex: 1; background: var(--bg); border: 1px solid var(--surface-border); border-radius: 0.65rem;
      padding: 0.65rem 0.85rem; color: white; font-family: monospace; font-size: 0.9rem;
      outline: none; transition: border-color 0.2s;
    }
    .manual-input:focus { border-color: var(--primary); }

    .btn {
      background: var(--primary); color: white; border: none; padding: 0.65rem 1.1rem;
      border-radius: 0.65rem; font-weight: 600; font-size: 0.85rem; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      transition: all 0.2s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface-card); border: 1px solid var(--surface-border); color: var(--text); }

    .pc-device-badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      background: rgba(99, 102, 241, 0.15); border: 1px solid var(--primary);
      padding: 0.4rem 0.85rem; border-radius: 0.5rem; font-size: 0.85rem;
      color: #a5b4fc; font-weight: 600; margin-top: 0.5rem;
    }

    .scanner-container {
      position: relative;
      width: 100%; border-radius: 1rem; overflow: hidden;
      background: #000; border: 1px solid var(--surface-border);
      min-height: 250px; display: flex; align-items: center; justify-content: center;
    }

    #reader { width: 100%; border: none !important; }
    #reader video { width: 100% !important; object-fit: cover !important; border-radius: 0.85rem; }
    #reader__dashboard { display: none !important; }

    .permission-overlay {
      position: absolute; inset: 0; background: var(--surface-card);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 1.5rem; text-align: center; z-index: 10; gap: 0.85rem;
    }
    .permission-icon {
      width: 48px; height: 48px; border-radius: 50%; background: rgba(99, 102, 241, 0.15);
      color: var(--primary); display: flex; align-items: center; justify-content: center;
    }

    .scan-history-title { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .scan-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 200px; overflow-y: auto; }
    .scan-item {
      background: var(--bg); border: 1px solid var(--surface-border); padding: 0.75rem 0.85rem;
      border-radius: 0.65rem; font-family: monospace; font-size: 0.85rem;
      display: flex; justify-content: space-between; align-items: center;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">
      <span>📱</span> Mobile Scanner
    </div>
    <div id="status-pill" class="status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Unpaired</span>
    </div>
  </header>

  <main>
    <section class="card">
      <div id="step-title-container" class="pairing-header">
        <h2 id="step-title" class="pairing-title">Pairing: Scan QR or Enter Code</h2>
        <p class="pairing-sub">Connect to receiver hub on desktop</p>
      </div>

      <div id="manual-box" class="manual-pair-box">
        <input id="code-input" type="text" class="manual-input" placeholder="Enter Peer Code">
        <button class="btn" onclick="connectByCode()">Pair</button>
      </div>

      <div class="scanner-container">
        <!-- Camera Permission Overlay UI -->
        <div id="cam-permission-overlay" class="permission-overlay">
          <div class="permission-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
          <div style="font-weight: 600; font-size: 0.95rem;">Camera Access Required</div>
          <div style="font-size: 0.78rem; color: var(--text-muted);">Grant camera permission to start continuous QR scanning.</div>
          <button id="enable-btn" class="btn" onclick="requestCameraAccess()">Enable Camera</button>
        </div>

        <div id="reader"></div>
      </div>

      <!-- Option A: Snap Frame Button -->
      <button id="manual-scan-btn" class="btn btn-secondary" style="width: 100%; margin-top: 0.85rem;" onclick="triggerManualDetection()">
        📷 Snap / Detect Current Frame
      </button>
    </section>

    <section class="card">
      <div class="scan-history-title">Transmission History</div>
      <div id="scan-history" class="scan-list">
        <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1.5rem 0;">No scans sent yet</div>
      </div>
    </section>
  </main>

  <script>
    let peer = new Peer({
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:stun1.l.google.com:19302' }
        ]
      }
    });
    
    let conn = null;
    let isPaired = false;
    let html5QrCode = null;

    const statusPill = document.getElementById("status-pill");
    const statusText = document.getElementById("status-text");
    const stepTitleContainer = document.getElementById("step-title-container");
    const scanHistory = document.getElementById("scan-history");
    const permOverlay = document.getElementById("cam-permission-overlay");

    function requestCameraAccess() {
      const btn = document.getElementById("enable-btn");
      btn.innerText = "Starting Camera...";
      btn.disabled = true;

      html5QrCode = new Html5Qrcode("reader");

      const config = { fps: 10, qrbox: { width: 220, height: 220 } };

      // Try environment (back) camera first
      html5QrCode.start(
        { facingMode: "environment" },
        config,
        onScanSuccess,
        onScanError
      ).then(() => {
        permOverlay.style.display = "none";
      }).catch(err => {
        // Fallback: try default camera if facingMode fails
        html5QrCode.start(
          {},
          config,
          onScanSuccess,
          onScanError
        ).then(() => {
          permOverlay.style.display = "none";
        }).catch(err2 => {
          alert("Camera Error: Please make sure browser camera permissions are allowed for this site.");
          btn.innerText = "Enable Camera";
          btn.disabled = false;
        });
      });
    }

    function onScanError(err) {
      // Continuous background scanner loop
    }

    function connectByCode() {
      const code = document.getElementById("code-input").value.trim();
      if (code) initiatePairing(code);
    }

    function onScanSuccess(decodedText) {
      if (!isPaired) {
        initiatePairing(decodedText);
      } else if (conn && conn.open) {
        conn.send(decodedText);
        if (navigator.vibrate) navigator.vibrate(80);
        addScanHistoryItem(decodedText);
      }
    }

    function triggerManualDetection() {
      const videoElement = document.querySelector("#reader video");
      if (!videoElement) {
        alert("Please tap 'Enable Camera' first to launch the video stream.");
        return;
      }

      const canvas = document.createElement("canvas");
      canvas.width = videoElement.videoWidth;
      canvas.height = videoElement.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      const scannerEngine = new Html5Qrcode("reader");
      
      canvas.toBlob((blob) => {
        const file = new File([blob], "snapshot.png", { type: "image/png" });
        scannerEngine.scanFile(file, true)
          .then(decodedText => {
            onScanSuccess(decodedText);
          })
          .catch(err => {
            alert("No clear QR code found in current frame. Re-align and try again.");
          });
      });
    }

    function initiatePairing(targetPeerId) {
      statusText.innerText = "Pairing...";
      conn = peer.connect(targetPeerId);

      conn.on('open', () => {
        isPaired = true;
        statusPill.classList.add("connected");
        statusText.innerText = "Connected";

        conn.send({ type: 'DEVICE_INFO', name: getMobileDeviceInfo() });

        document.getElementById("manual-box").style.display = "none";
        if (navigator.vibrate) navigator.vibrate(200);
      });

      conn.on('data', (data) => {
        if (typeof data === 'object' && data.type === 'DEVICE_INFO') {
          stepTitleContainer.innerHTML = `
            <div style="font-size: 0.8rem; color: var(--success); font-weight: 600; margin-bottom: 0.2rem;">✅ CONNECTED RECEIVER</div>
            <div class="pc-device-badge">💻 ${escapeHtml(data.name)}</div>
            <p class="pairing-sub" style="margin-top: 0.5rem;">Point camera at target QRs to transmit payload instantly.</p>
          `;
        }
      });

      conn.on('close', () => {
        isPaired = false;
        statusPill.classList.remove("connected");
        statusText.innerText = "Disconnected";
        stepTitleContainer.innerHTML = `
          <h2 id="step-title" class="pairing-title">Pairing: Scan QR or Enter Code</h2>
          <p class="pairing-sub">Connect to receiver hub on desktop</p>
        `;
        document.getElementById("manual-box").style.display = "flex";
      });
    }

    function getMobileDeviceInfo() {
      const ua = navigator.userAgent;
      let device = "Mobile Device";
      
      if (ua.includes("iPhone")) device = "iPhone";
      else if (ua.includes("iPad")) device = "iPad";
      else if (ua.includes("Android")) {
        const match = ua.match(/Android\s+[\d\.]+;\s*([^;)]+)/);
        device = match ? match[1] : "Android Device";
      }

      return device;
    }

    function addScanHistoryItem(text) {
      if (scanHistory.children[0]?.innerText.includes("No scans sent")) {
        scanHistory.innerHTML = "";
      }
      const item = document.createElement("div");
      item.className = "scan-item";
      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      item.innerHTML = `
        <span style="word-break: break-all; margin-right: 0.5rem;">${escapeHtml(String(text))}</span>
        <span style="color: var(--text-muted); font-size: 0.7rem; white-space: nowrap;">${now}</span>
      `;
      scanHistory.insertBefore(item, scanHistory.firstChild);
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
