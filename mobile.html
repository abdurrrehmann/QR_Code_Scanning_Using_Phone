<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile WebRTC Scanner</title>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-border: #334155;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--surface-border);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .status-pill.connected {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
        }

        main {
            flex: 1;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 1rem;
            padding: 1.25rem;
        }

        .manual-pair-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .manual-input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--surface-border);
            border-radius: 0.5rem;
            padding: 0.6rem 0.8rem;
            color: white;
            font-family: monospace;
            /* Removed text-transform so exact casing is preserved */
        }

        .btn-connect {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
        }

        .pc-device-badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid var(--primary);
            padding: 0.35rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            color: #a5b4fc;
            margin-top: 0.4rem;
            font-weight: 600;
        }

        .scanner-viewport {
            width: 100%;
            border-radius: 0.75rem;
            overflow: hidden;
            background: #000;
            border: 2px dashed var(--surface-border);
        }

        #reader video {
            object-fit: cover !important;
        }

        .scan-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--surface-border);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-family: monospace;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            margin-top: 0.5rem;
        }
    </style>
</head>

<body>

    <header>
        <strong style="font-size: 1rem;">Mobile Scanner</strong>
        <div id="status-pill" class="status-pill">
            <div class="status-dot"></div>
            <span id="status-text">Unpaired</span>
        </div>
    </header>

    <main>
        <section class="card">
            <div id="step-title-container">
                <h2 id="step-title" style="font-size: 0.95rem; margin-bottom: 0.75rem;">Pairing: Scan QR or Enter Code
                </h2>
            </div>

            <div id="manual-box" class="manual-pair-box">
                <input id="code-input" type="text" class="manual-input" placeholder="Enter Peer Code">
                <button class="btn-connect" onclick="connectByCode()">Pair</button>
            </div>

            <div class="scanner-viewport">
                <div id="reader"></div>
            </div>
        </section>

        <section class="card">
            <h3 style="font-size: 0.85rem; color: var(--text-muted);">Transmission History</h3>
            <div id="scan-history">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 1rem;">No scans
                    sent</div>
            </div>
        </section>
    </main>

    <script>
        let peer = new Peer();
        let conn = null;
        let isPaired = false;
        let scanner = null;

        const statusPill = document.getElementById("status-pill");
        const statusText = document.getElementById("status-text");
        const stepTitleContainer = document.getElementById("step-title-container");
        const scanHistory = document.getElementById("scan-history");

        window.addEventListener("load", () => {
            scanner = new Html5QrcodeScanner("reader", { fps: 15, qrbox: { width: 220, height: 220 } });
            scanner.render(onScanSuccess);
        });

        function connectByCode() {
            const code = document.getElementById("code-input").value.trim();
            if (code) initiatePairing(code);
        }

        function onScanSuccess(decodedText) {
            if (!isPaired) {
                initiatePairing(decodedText);
            } else if (conn && conn.open) {
                conn.send(decodedText);
                if (navigator.vibrate) navigator.vibrate(80);
                addScanHistoryItem(decodedText);
            }
        }

        function initiatePairing(targetPeerId) {
            statusText.innerText = "Pairing...";
            conn = peer.connect(targetPeerId);

            conn.on('open', () => {
                isPaired = true;
                statusPill.classList.add("connected");
                statusText.innerText = "Connected";

                conn.send({ type: 'DEVICE_INFO', name: getMobileDeviceInfo() });

                document.getElementById("manual-box").style.display = "none";
                if (navigator.vibrate) navigator.vibrate(200);
            });

            conn.on('data', (data) => {
                if (typeof data === 'object' && data.type === 'DEVICE_INFO') {
                    stepTitleContainer.innerHTML = `
            <div style="margin-bottom: 0.2rem; font-size: 0.85rem; color: var(--success); font-weight: 600;">✅ Connected Receiver:</div>
            <div class="pc-device-badge">💻 ${escapeHtml(data.name)}</div>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 0.75rem;">Point camera at target QRs to transmit payload</p>
          `;
                }
            });

            conn.on('close', () => {
                isPaired = false;
                statusPill.classList.remove("connected");
                statusText.innerText = "Disconnected";
                stepTitleContainer.innerHTML = `<h2 id="step-title" style="font-size: 0.95rem; margin-bottom: 0.75rem;">Pairing: Scan QR or Enter Code</h2>`;
                document.getElementById("manual-box").style.display = "flex";
            });
        }

        function getMobileDeviceInfo() {
            const ua = navigator.userAgent;
            let device = "Mobile Device";

            if (ua.includes("iPhone")) device = "iPhone";
            else if (ua.includes("iPad")) device = "iPad";
            else if (ua.includes("Android")) {
                const match = ua.match(/Android\s+[\d\.]+;\s*([^;)]+)/);
                device = match ? match[1] : "Android Device";
            }

            return device;
        }

        function addScanHistoryItem(text) {
            if (scanHistory.children[0]?.innerText.includes("No scans sent")) {
                scanHistory.innerHTML = "";
            }
            const item = document.createElement("div");
            item.className = "scan-item";
            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            item.innerHTML = `<span>${escapeHtml(String(text))}</span><span style="color: var(--text-muted); font-size: 0.7rem;">${now}</span>`;
            scanHistory.insertBefore(item, scanHistory.firstChild);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>

</html>
